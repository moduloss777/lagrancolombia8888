<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Marketing API - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header-subtitle {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .response-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .response-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .response-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            color: #333;
            border-left: 4px solid #667eea;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 12px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📱 SMS Marketing API</h1>
            <p class="header-subtitle">Powered by TraffiLink | API REST para envío de SMS</p>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Enviados</h3>
                <div class="number" id="stat-sent">0</div>
            </div>
            <div class="stat-card">
                <h3>Entregados</h3>
                <div class="number" id="stat-delivered">0</div>
            </div>
            <div class="stat-card">
                <h3>Fallidos</h3>
                <div class="number" id="stat-failed">0</div>
            </div>
            <div class="stat-card">
                <h3>Balance EUR</h3>
                <div class="number" id="stat-balance">--</div>
            </div>
        </div>

        <!-- Send Single SMS -->
        <div class="form-section">
            <h2>✉️ Enviar SMS</h2>

            <form id="smsForm">
                <div class="form-group">
                    <label for="numero">Número (ej: 573001234567)</label>
                    <input type="text" id="numero" placeholder="573001234567" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" placeholder="Escribe tu mensaje..." required></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">
                        <span class="spinner" id="spinner"></span>
                        Enviar SMS
                    </button>
                    <button type="reset" class="btn-secondary">Limpiar</button>
                </div>

                <div class="message" id="message"></div>
            </form>
        </div>

        <!-- Response -->
        <div class="response-section">
            <h2>📊 Respuesta</h2>
            <div class="response-box" id="responseBox">
                Aquí aparecerá la respuesta del servidor...
            </div>
        </div>

        <footer>
            <p>SMS Marketing API v2.0 | Optimizado para Render | GoleadorSmsMarketing</p>
        </footer>
    </div>

    <script>
        // Actualizar stats
        function actualizarStats() {
            // Actualizar stats
            fetch('/api/stats')
                .then(r => {
                    if (!r.ok) throw new Error('Error obteniendo stats');
                    return r.json();
                })
                .then(data => {
                    document.getElementById('stat-sent').textContent = data.total_sent || 0;
                    document.getElementById('stat-delivered').textContent = data.total_delivered || 0;
                    document.getElementById('stat-failed').textContent = data.total_failed || 0;
                })
                .catch(e => {
                    console.error('Error actualizando stats:', e);
                    document.getElementById('stat-sent').textContent = '0';
                    document.getElementById('stat-delivered').textContent = '0';
                    document.getElementById('stat-failed').textContent = '0';
                });

            // Actualizar balance
            fetch('/api/balance')
                .then(r => {
                    if (!r.ok) {
                        console.error('Error HTTP en balance:', r.status);
                        throw new Error('Error HTTP ' + r.status);
                    }
                    return r.json();
                })
                .then(data => {
                    console.log('Balance data:', data);
                    if (data.exito && data.balance !== null && data.balance !== undefined) {
                        document.getElementById('stat-balance').textContent = data.balance.toFixed(2) + ' €';
                    } else {
                        document.getElementById('stat-balance').textContent = 'Error ⚠️';
                        console.warn('Balance error:', data.error || 'Unknown error');
                    }
                })
                .catch(e => {
                    console.error('Error actualizando balance:', e);
                    document.getElementById('stat-balance').textContent = 'Error ⚠️';
                });
        }

        // Enviar SMS
        document.getElementById('smsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const numero = document.getElementById('numero').value;
            const mensaje = document.getElementById('mensaje').value;
            const spinner = document.getElementById('spinner');
            const button = e.target.querySelector('button[type="submit"]');
            const messageEl = document.getElementById('message');

            spinner.style.display = 'inline-block';
            button.disabled = true;

            try {
                const response = await fetch('/api/sms/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero, mensaje })
                });

                const data = await response.json();

                // Mostrar respuesta
                document.getElementById('responseBox').textContent = JSON.stringify(data, null, 2);

                if (response.ok) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✅ SMS enviado correctamente';
                    document.getElementById('smsForm').reset();

                    // Actualizar stats después de 2 segundos
                    setTimeout(actualizarStats, 2000);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = '❌ Error: ' + (data.error || 'Error desconocido');
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Error de conexión: ' + error.message;
                document.getElementById('responseBox').textContent = error.message;
            } finally {
                spinner.style.display = 'none';
                button.disabled = false;
            }
        });

        // Actualizar stats al cargar
        actualizarStats();

        // Actualizar stats cada 30 segundos
        setInterval(actualizarStats, 30000);
    </script>
</body>
</html>
